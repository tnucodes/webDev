<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
</head>

<body>
    <form method="get">
        First Name : <input type="text" name="firstname"><br>
        Last Name : <input type="text" name="lastname"><br>
        Email: <input type="email" required name="email"><br>
        Password : <input type="password" minlength="5" name="password"><br>
        Birthday : <input type="date" name="birthday"><br>
        Gender : <br>
        <input type="radio" name="gender" value="male">Male<br>
        <input type="radio" name="gender" value="female">Female<br>
        <input type="radio" name="gender" value="other">Others<br>
        Interests : <br>
        <input type="checkbox" name="dance">Dance<br>
        <input type="checkbox" name="singing">Singing<br>
        <input type="checkbox" name="art">Art<br>
        Cars:<br>
        <select name="cars">
            <option value="Ford">Ford</option>
            <option value="Swift">Swift</option>
            <option value="BMW">BMW</option>
        </select><br>
        <br><input type="submit" value="Register!">
        <input type="reset">
    </form>
</body>

</html>
