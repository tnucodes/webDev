<html>

<head>
    <title>Robot</title>
    <style>
        .head {
            display:flex;
            flex-direction:row;
            justify-content: center;
            gap:20px;
            align-items: center;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            width: 100px;
            height: 60px;
        }

        .head:hover {
            transform: scaleX(1.5);
            transition: all 1s;
        }

        .eye{
            background-color: white;
            width:8px;
            height:8px;
            border-radius: 1000px;
        }

        .body {
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            width: 100px;
            height: 100px;
            background-color: blue;
        }

        .limb {
            border-radius: 25px;
        }

        .hand {
            margin-top: 2px;
            background-color: blue;
            width: 20px;
            height: 75px;
        }

        .leg {
            background-color: blue;
            width: 20px;
            height: 60px;
        }
        .leg:hover{
            transform: rotateZ(30deg);
            transition: all 1s;
        }
        h1{
            text-align: center;
            color: firebrick;
        }
    </style>
</head>

<body>

    <h1 style="margin: 20px 0;">Robo Friend</h1>

    <div style="display: flex; flex-direction: column; justify-content: center;">

        <div class="head" style="margin: 0 auto; background-color: blue;">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>

        <div style="justify-content: center;display: flex;flex-direction: row; gap:4px; margin-top: 4px;">
            <div class="hand limb"> </div>

            <div class="body"> </div>

            <div class="hand limb"> </div>
        </div>


        <div style="justify-content: center;display: flex;flex-direction: row; gap:12px; margin-top: -20px;">
            <div class="leg limb"></div>
            <div class="leg limb"></div>
        </div>
    </div>


    </div>

</body>

</html>
